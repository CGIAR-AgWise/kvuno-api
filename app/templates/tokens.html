{% extends "base.html" %}
{% block title %}kvuno — Tokens{% endblock %}
{% block content %}
<div class="px-3 px-xl-5">
    <h2 class="mb-3">Active Tokens</h2>
    <p class="text-muted">Tokens let you authenticate API requests. Revoke any you don't recognise.</p>
    <table class="table table-bordered" id="token-table">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Created</th>
                <th>Expires</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="token-body"></tbody>
    </table>
    <p class="text-muted" id="no-tokens">No active tokens found.</p>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    async function loadTokens() {
        const t = getToken();
        if (!t) { window.location.href = '/ui/login'; return; }
        const resp = await fetch('/api/v1/users/tokens', {
            headers: {'Authorization': 'Bearer ' + t},
        });
        if (!resp.ok) { window.location.href = '/ui/login'; return; }
        const data = await resp.json();
        const tokens = Array.isArray(data) ? data : (data.tokens || []);
        const tbody = document.getElementById('token-body');
        const none = document.getElementById('no-tokens');
        tbody.innerHTML = '';
        if (!tokens.length) {
            none.style.display = '';
            return;
        }
        none.style.display = 'none';
        tokens.forEach(tk => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${tk.id}</td>
                <td>${tk.created_at ? new Date(tk.created_at).toLocaleString() : '-'}</td>
                <td>${tk.expires_at ? new Date(tk.expires_at).toLocaleString() : 'Never'}</td>
                <td><button class="btn btn-sm btn-outline-danger" onclick="revoke(${tk.id})">Revoke</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    async function revoke(id) {
        const t = getToken();
        if (!t) return;
        const resp = await fetch('/api/v1/users/tokens/' + id, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + t},
        });
        if (resp.ok) {
            showToast('Token revoked', 'success');
            loadTokens();
        } else {
            showToast('Failed to revoke token', 'danger');
        }
    }

    loadTokens();
</script>
{% endblock %}
