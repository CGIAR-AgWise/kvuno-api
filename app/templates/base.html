<!DOCTYPE html>
<!--suppress HtmlUnknownAttribute, HtmlUnknownTarget -->
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}kvuno{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/material.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-light" {% block body_attrs %}{% endblock %}>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-3">
    <div class="container-fluid px-3 px-xl-5">
        <a class="navbar-brand fw-semibold py-1" href="/ui/jobs">kvuno</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-main">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-main">
            <ul class="navbar-nav ms-auto gap-2">
                <li class="nav-item">
                    <a class="nav-link{% if active_nav == 'upload' %} active{% endif %}" href="/ui/upload">Upload</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_nav == 'jobs' %} active{% endif %}" href="/ui/jobs">Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_nav == 'explore' %} active{% endif %}" href="/ui/explore">Explore</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_nav == 'quality' %} active{% endif %}" href="/ui/quality">Quality</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active_nav == 'tokens' %} active{% endif %}" href="/ui/tokens">Tokens</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/api-docs" target="_blank">API docs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="logout-link">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid px-3 px-xl-5 py-2 fade-in main-content">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-4">
    kvuno &middot; <a href="https://agwise.cgiar.org" class="text-reset text-decoration-none" target="_blank">AgWise</a>
</footer>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script>
    /* Token helpers */
    function getToken() {
        return localStorage.getItem('token');
    }

    function authHeaders() {
        const t = getToken();
        return t ? {'Authorization': 'Bearer ' + t} : {};
    }

    document.getElementById('logout-link').addEventListener('click', async function (e) {
        e.preventDefault();
        const t = getToken();
        if (t) {
            await fetch('/api/v1/users/logout', {
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + t},
            });
        }
        localStorage.removeItem('token');
        document.cookie = 'token=; path=/; max-age=0; SameSite=Lax';
        window.location.href = '/ui/login';
    });

    /* Global toast utility */
    function showToast(msg, type) {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const el = document.createElement('div');
        el.className = 'toast-message' + (type ? ' ' + type : '');
        const icons = {
            danger: 'bi-x-circle-fill',
            success: 'bi-check-circle-fill',
            warning: 'bi-exclamation-triangle-fill'
        };
        const icon = icons[type] || 'bi-info-circle-fill';
        el.innerHTML = '<i class="bi ' + icon + '"></i> ' + escapeHtml(msg);
        c.appendChild(el);
        setTimeout(function () {
            el.style.opacity = '0';
            el.style.transition = 'opacity .3s';
            setTimeout(function () {
                el.remove();
            }, 300);
        }, 3500);
    }

    function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        const d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
