<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kvuno — Register</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
<div class="container" style="max-width: 440px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Create an account</h2>

            <div id="alert-box" class="alert d-none" role="alert"></div>

            <form id="auth-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required autocomplete="username"
                           minlength="3">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="new-password"
                           minlength="8">
                </div>
                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirm password</label>
                    <input type="password" id="confirm-password" class="form-control" required
                           autocomplete="new-password" minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3" id="submit-btn">Register</button>
            </form>

            <p class="text-center small mb-0">
                Already have an account? <a href="/ui/login">Sign in</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('auth-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(msg, type) {
        alertBox.className = 'alert alert-' + type + ' d-block';
        alertBox.textContent = msg;
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        submitBtn.disabled = true;

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (password !== confirm) {
            showAlert('Passwords do not match', 'danger');
            submitBtn.disabled = false;
            return;
        }

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();

        const regResp = await fetch('/api/v1/users/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password}),
        });
        const regData = await regResp.json();

        if (!regResp.ok) {
            showAlert(regData.msg || regData.error || 'Registration failed', 'danger');
            submitBtn.disabled = false;
            return;
        }

        const loginResp = await fetch('/api/v1/users/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password}),
        });
        const loginData = await loginResp.json();

        if (!loginResp.ok) {
            window.location.href = '/ui/login';
            return;
        }

        localStorage.setItem('token', loginData.access_token);
        document.cookie = 'token=' + loginData.access_token
            + '; path=/; max-age=' + (30 * 24 * 60 * 60) + '; SameSite=Lax';
        window.location.href = '/ui/jobs';
    });
</script>
</body>
</html>
