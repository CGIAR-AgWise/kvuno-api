<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kvuno — Sign in</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
<div class="container" style="max-width: 440px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Sign in</h2>

            <div id="alert-box" class="alert d-none" role="alert"></div>

            <form id="auth-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3" id="submit-btn">Sign in</button>
            </form>

            <p class="text-center small mb-0">
                Don't have an account? <a href="/ui/register">Register</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('auth-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(msg, type) {
        alertBox.className = 'alert alert-' + type + ' d-block';
        alertBox.textContent = msg;
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        submitBtn.disabled = true;

        const resp = await fetch('/api/v1/users/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
            }),
        });
        const data = await resp.json();

        if (!resp.ok) {
            showAlert(data.msg || data.error || 'Login failed', 'danger');
            submitBtn.disabled = false;
            return;
        }

        localStorage.setItem('token', data.access_token);
        document.cookie = 'token=' + data.access_token
            + '; path=/; max-age=' + (30 * 24 * 60 * 60) + '; SameSite=Lax';
        window.location.href = new URLSearchParams(window.location.search).get('next') || '/ui/jobs';
    });
</script>
</body>
</html>
