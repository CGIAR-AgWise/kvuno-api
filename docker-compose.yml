networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  # Shared builder base (python:3.14-slim + pinned Poetry), published as
  # ghcr.io/masgeek/python-3.14-poetry:<version>. CI does not build it — build it
  # here and (optionally) push it:
  #   docker compose build base
  #   docker push ghcr.io/masgeek/python-3.14-poetry:2.3.2
  # The tag MUST match the `POETRY_VERSION` ARG in Dockerfile.base and in the
  # three application Dockerfiles, because those do
  # `FROM ghcr.io/masgeek/python-3.14-poetry:${POETRY_VERSION}`.
  base:
    image: ghcr.io/masgeek/python-3.14-poetry:${POETRY_VERSION:-2.3.2}
    build:
      context: .
      dockerfile: docker/Dockerfile.base
      args:
        POETRY_VERSION: ${POETRY_VERSION:-2.3.2}

  # One-shot, as root, before api/worker start: hand the data directory to the
  # image's `app` user. The containers run as that non-root user, and a volume
  # or host directory Docker created is owned by root — uploads then fail with
  # "Permission denied: 'static/data/uploads'". The user is named, not
  # numbered, so it resolves to whatever uid this image gives `app` (1000 in
  # current images). Only entries with the wrong owner are touched, so a
  # re-run is quick. It never blocks the app: if chown is impossible (some
  # Docker Desktop bind mounts), the api preflight reports it as not writable.
  data-init:
    image: ghcr.io/cgiar-agwise/kvuno-api:${TAG:-latest}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - "find /app/static/data \\( ! -user app -o ! -group app \\) -exec chown -h app:app {} + || echo 'data-init: could not chown /app/static/data' >&2"
    restart: "no"
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data

  # Production API: gunicorn (docker/Dockerfile.prod.dockerfile), debug off.
  # For the Flask dev server use the `api-dev` service below
  # (`docker compose --profile dev up api-dev`).
  api:
    container_name: kvuno-api
    hostname: kvuno-api
    image: ghcr.io/cgiar-agwise/kvuno-api:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod.dockerfile
    restart: unless-stopped
    # Settings come from .env; their defaults live in app/config.py (see
    # .env.example, generated from it). `environment:` holds only what differs
    # in compose — restating a default here is how values used to drift.
    env_file:
      - .env
    environment: &api-environment
      # production = JSON log lines (app/utils/logging.py); set development for
      # readable console output.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Postgres/PostGIS is not a compose service, so there is no sensible
      # default host: set it in .env (or the shell) to a host reachable from
      # inside the container — not localhost.
      DB_HOST: ${DB_HOST:?DB_HOST is required (Postgres is external to compose)}
      # docker/entrypoint.sh applies migrations before starting the server when
      # this is true (its own default). Compose overrides it to false, so
      # migrations must be run manually:
      #   docker compose exec api Python scripts/run_migrations.py
      # Set true to let the api migrate on start — but never with more than one
      # replica, or they race to migrate the same schema.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      # Pinned off whatever .env says: this the compose file's api enqueues no
      # work (set it true, with CELERY_BROKER_URL, to hand uploads to `worker`).
      HOUSEKEEPING_ENABLED: false
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data
    ports:
      # host 5000 -> container 80 (the app's default port)
      - "127.0.0.1:5000:80"
    # The app listens on port 80, but the container runs as the non-root `app`
    # user, and ports below 1024 are privileged on Linux. Without this the
    # process dies with Permission denied at bind time.
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - dokploy-network
      - internal

  # Development API: Flask dev server (docker/Dockerfile, `python3 run.py`) with
  # debug on. Only started with the `dev` profile:
  #   docker compose --profile dev up api-dev
  # Published on host 5002 so it can run beside `api`. Its image tag matches
  # what CI pushes for develop branch builds of docker/Dockerfile.
  api-dev:
    profiles: [ dev ]
    container_name: kvuno-api-dev
    hostname: kvuno-api-dev
    image: ghcr.io/cgiar-agwise/kvuno-api:${DEV_TAG:-develop}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *api-environment
      FLASK_DEBUG: ${FLASK_DEBUG:-true}
      DEBUG_DB: ${DEBUG_DB:-true}
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data
    ports:
      - "127.0.0.1:5002:80"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - dokploy-network
      - internal

  # React SPA + nginx. Serves the built bundle and reverse-proxies /api and
  # the remaining /ui/* endpoints to the api service, so the browser sees a
  # single origin and no CORS preflight is needed in production.
  web:
    container_name: kvuno-web
    hostname: kvuno-web
    image: ghcr.io/cgiar-agwise/kvuno-web:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Where nginx proxies /api, /ui, /api-docs and /health: the api container
      # by its unique container_name. NOT the bare service name `api`: on
      # dokploy-network, shared with other projects, `api` resolved to another
      # project's container. (The production stack in proxy-tool names its API
      # service `kvuno` and sets API_UPSTREAM=http://kvuno:80.)
      # noinspection HttpUrlsUsage
      API_UPSTREAM: ${API_UPSTREAM:-http://kvuno-api:80}
    ports:
      - "127.0.0.1:5001:80"
    # Wait for the API to actually serve, not merely to start: /health only
    # passes once the DB is reachable (and any RUN_MIGRATIONS=true migration
    # has finished).
    # nginx re-resolves anyway, but starting first just produces a burst of
    # 502s on the first page load.
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal

  worker:
    container_name: kvuno-worker
    # Time to stop cleanly. On SIGTERM the running ingest finishes its
    # current chunk, commits rows + offset and pauses; the restarted worker
    # resumes it. Docker's default 10 s killed it mid-file instead.
    stop_grace_period: 2m
    hostname: kvuno-worker
    image: ghcr.io/cgiar-agwise/kvuno-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    # The same .env as the api, so every setting reaches the worker. It used
    # to list each variable by hand, and a new worker-side setting silently
    # kept its default until someone remembered to add it here as well.
    env_file:
      - .env
    environment:
      # JSON log lines, matching the api (app/utils/logging.py).
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: ${DB_HOST:?DB_HOST is required (Postgres is external to compose)}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # Redis is external too; the app's default (localhost) is wrong in a container.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data
    # Celery has no HTTP port, so ask the worker itself over the broker. The
    # node name is celery@<container hostname> (kvuno-worker); `$$` stops
    # compose from interpolating $HOSTNAME. The ping is answered by the parent
    # process, so a long ingest in a child does not fail it.
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1" ]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3
    networks:
      - dokploy-network
      - internal
