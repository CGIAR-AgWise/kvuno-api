name: Docker Build Reusable

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      branch_ref:
        required: true
        type: string
      branch_name:
        required: true
        type: string
      commit_sha:
        required: false
        type: string
        default: ''
      app_version:
        required: false
        type: string
        default: '0.0.0-dev'
        description: Reported by /health and the OpenAPI Info block


jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      cancel-in-progress: true
      group: docker-build-reusable-${{ inputs.image_name }}-${{ inputs.branch_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || inputs.branch_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR authenticates with the workflow's own GITHUB_TOKEN (packages: write),
      # so no DOCKER_USERNAME / DOCKER_PASSWORD secrets are required.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set Docker tags
        id: docker_tags
        uses: ./.github/actions/set-docker-tags
        with:
          image_name: ${{ inputs.image_name }}
          ref: ${{ inputs.branch_ref }}
          ref_name: ${{ inputs.branch_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: APP_VERSION=${{ inputs.app_version }}
          push: true
          provenance: false
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=registry,ref=${{ inputs.image_name }}:cache-${{ inputs.branch_name }}
          cache-to: type=registry,ref=${{ inputs.image_name }}:cache-${{ inputs.branch_name }},mode=max
