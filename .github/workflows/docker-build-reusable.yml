name: Docker Build Reusable

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string
      profile:
        required: true
        type: string
      ref_type:
        required: true
        type: string
      ref_name:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      tags:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Compute source hash
        id: source_hash
        run: |
          HASH=$(find . -type f \( -name "*.py" -o -name "*.toml" -o -name "*.lock" -o -name "*.txt" -o -name "Dockerfile*" -o -name "*.ts" -o -name "*.tsx" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Check build cache
        id: build_cache
        uses: actions/cache@v5
        with:
          path: /tmp/build-marker
          key: docker-build-${{ inputs.image }}-${{ steps.source_hash.outputs.hash }}
          enableCrossOsArchive: true

      - name: Skip if source unchanged
        if: steps.build_cache.outputs.cache-hit == 'true'
        run: |
          echo "Source unchanged for ${{ inputs.image }} (hash: ${{ steps.source_hash.outputs.hash }}), skipping build"
          echo "skipped=true" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.build_cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.build_cache.outputs.cache-hit != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.build_cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: APP_VERSION=${{ inputs.version }}
          push: true
          provenance: true
          tags: ${{ inputs.tags }}
          cache-from: type=registry,ref=${{ inputs.image }}:cache-${{ inputs.sha }}
          cache-to: type=registry,ref=${{ inputs.image }}:cache-${{ inputs.sha }},mode=max

      - name: Write build marker
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: mkdir -p /tmp/build-marker && echo "${{ steps.source_hash.outputs.hash }}" > /tmp/build-marker/hash