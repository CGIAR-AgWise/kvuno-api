name: "UnitTests"

# Built to spend as few CI minutes as possible without dropping a check:
#
# - A `changes` job classifies the diff (GitHub compare API, no clone) and every
#   other job runs only if its area changed. A docs-only PR costs one tiny job.
#   A job skipped by its `if` still counts as passing for required checks.
# - Lint, audit and tests share ONE job and one dependency install. Billing
#   rounds every job up to a whole minute, so separate jobs each paid for a
#   runner start and a `poetry install`.
# - Tests run on 3.14 only, the version the images ship.
# - Draft PRs run nothing; a new push to a PR cancels the run it replaces.
#
# develop/main pushes are REQUIRED here: docker-build.yml and version-release.yml
# start from a *successful push run* of this workflow. Feature-branch pushes are
# not built — their pull_request run covers them.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unittests-${{ github.event.pull_request.number || github.ref }}
  # PR runs are superseded by the next push. Push runs always finish: the image
  # build and the release hang off their success.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.areas.outputs.python }}
      frontend: ${{ steps.areas.outputs.frontend }}
      docker_matrix: ${{ steps.areas.outputs.docker_matrix }}
      docker_any: ${{ steps.areas.outputs.docker_any }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - id: areas
        uses: ./.github/actions/changed-areas
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  python:
    name: Python (lint, audit, tests)
    needs: [ changes ]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The image production documents (AGENTS.md), so migrations and the
      # spatial queries meet the real thing. The unit suite cannot use it:
      # pytest-env pins SQLite.
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: kvuno
          POSTGRES_PASSWORD: kvuno
          POSTGRES_DB: kvuno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvuno -d kvuno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # The images run python:3.14-slim. pyproject.toml still allows 3.13.
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Must match the Poetry that generated poetry.lock (and the images'
          # POETRY_VERSION); other 2.x releases compute a different lock hash.
          version: 2.3.2
          virtualenvs-in-project: true

      # The virtualenv is the only cache worth keeping: restored, `poetry
      # install` is a no-op. Separate pip/Poetry caches only added save time.
      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-3.14-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Audit Python dependencies
        run: poetry run pip-audit --strict --progress-spinner off

      - name: Run tests
        run: poetry run pytest -q --tb=short

      # .env.example and the README configuration table are generated from
      # app/config.py; a setting changed there without regenerating fails here.
      - name: Check generated configuration docs
        run: poetry run python scripts/gen_config_docs.py --check

      # pytest-env only injects the DB settings for pytest runs — a bare
      # `python -c` gets nothing. Mirrors [tool.pytest.ini_options] env so both
      # paths agree. Imports the API and worker entry modules and validates
      # the settings, as a container start would.
      - name: Smoke-test app import
        env:
          DB_URL: "sqlite:///:memory:"
          DB_DRIVER: "sqlite"
          DB_NAME: ":memory:"
        run: poetry run python -c "import app, app.celery_app, app.tasks; from app.config import get_settings; get_settings().database_url()"

      # SQLite cannot run the migrations or ST_DWithin, so a Postgres-only
      # break (a geometry binding, the geography cast behind `radius` in
      # metres) passed every other step. This is the real schema, from the
      # migrations, on the documented PostGIS image.
      - name: PostGIS migrations and spatial query
        env:
          DB_URL: "postgresql://kvuno:kvuno@localhost:5432/kvuno"
        run: |
          poetry run alembic upgrade head
          poetry run python scripts/postgis_smoke.py

  frontend:
    name: Frontend (typecheck + build)
    needs: [ changes ]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `build` runs `tsc -b` first, so a type error fails here rather than
      # producing a bundle that breaks at runtime in the browser.
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm run build

      - name: Audit JavaScript dependencies
        working-directory: frontend
        # Blocking for high/critical advisories, like pip-audit --strict on the
        # Python side. Low/moderate findings are reported but do not fail CI.
        run: pnpm audit --audit-level high

  # Builds, without pushing, only the images whose BUILD inputs changed
  # (Dockerfiles, entrypoints, lockfiles, nginx config) — app code cannot break
  # a Docker build, and the python/frontend jobs already cover it. Pushes
  # nothing and logs in nowhere, so it is safe for fork PRs.
  docker:
    name: Docker build (${{ matrix.name }})
    needs: [ changes ]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: APP_VERSION=pr-check
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
