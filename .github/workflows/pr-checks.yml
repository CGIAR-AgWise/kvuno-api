name: "UnitTests"

on:
  # develop/main pushes are required, not optional: docker-build.yml builds
  # images only from a *successful push run* of this workflow, so with these
  # off no image was ever built on merge. Feature-branch pushes stay off —
  # their pull_request run already covers them. No tag trigger: a release
  # tag points at a main commit that was tested by its push run, which is
  # what docker-build's gate checks.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Must match the Poetry that generated poetry.lock (and the images'
          # POETRY_VERSION); other 2.x releases compute a different lock hash.
          version: 2.3.2
          virtualenvs-in-project: true

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Cache Poetry
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Audit Python dependencies
        run: poetry run pip-audit --strict --progress-spinner off

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `build` runs `tsc -b` first, so a type error fails here rather than
      # producing a bundle that breaks at runtime in the browser.
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm run build

      - name: Audit JavaScript dependencies
        working-directory: frontend
        # Blocking for high/critical advisories, like pip-audit --strict on the
        # Python side. Low/moderate findings are reported but do not fail CI.
        run: pnpm audit --audit-level high

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [ lint, frontend ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the images run (python:3.14-slim); 3.13 is the floor
        # pyproject.toml allows.
        python-version: [ "3.13", "3.14" ]
    concurrency:
      group: test-py${{ matrix.python-version }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Must match the Poetry that generated poetry.lock (and the images'
          # POETRY_VERSION); other 2.x releases compute a different lock hash.
          version: 2.3.2
          virtualenvs-in-project: true

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Cache Poetry
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest -v --tb=short --junitxml=test-results.xml

      # app/config.py raises at import if the DB env vars are missing, and
      # pytest-env only injects them for pytest runs — a bare `python -c` gets
      # nothing. Mirrors [tool.pytest.ini_options] env so both paths agree.
      - name: Smoke-test app import
        env:
          DB_URL: "sqlite:///:memory:"
          DB_DRIVER: "sqlite"
          DB_NAME: ":memory:"
        run: poetry run python -c "from app.config import build_db_url; print('import OK:', build_db_url())"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 1

  # Build every image without pushing, so a broken Dockerfile, build context
  # or .dockerignore fails the PR instead of the post-merge build. Pushes
  # nothing and needs no registry login, so it is safe for fork PRs.
  docker:
    name: Docker build (${{ matrix.name }})
    # PRs only: on develop/main pushes docker-build.yml builds these for real.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: docker/Dockerfile.prod.dockerfile
          - name: api-dev
            context: .
            dockerfile: docker/Dockerfile
          - name: worker
            context: .
            dockerfile: docker/Dockerfile.worker
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile
    concurrency:
      group: docker-check-${{ matrix.name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: APP_VERSION=pr-check
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max