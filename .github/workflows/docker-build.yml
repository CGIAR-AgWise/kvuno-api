name: Docker Build

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  build-dev:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'develop')
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      dockerfile: Dockerfile
      image_name: masgeek/kvuno-api
      branch_ref: refs/heads/${{ github.event.workflow_run.head_branch }}
      branch_name: ${{ github.event.workflow_run.head_branch }}
      commit_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}

  build-prod:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      dockerfile: Dockerfile.prod.dockerfile
      image_name: masgeek/kvuno-api
      branch_ref: refs/heads/${{ github.event.workflow_run.head_branch }}
      branch_name: ${{ github.event.workflow_run.head_branch }}
      commit_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}

  build-worker:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'main'
          || github.event.workflow_run.head_branch == 'develop'
          || startsWith(github.event.workflow_run.head_branch, 'beta/'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      dockerfile: Dockerfile.worker
      image_name: masgeek/kvuno-worker
      branch_ref: refs/heads/${{ github.event.workflow_run.head_branch }}
      branch_name: ${{ github.event.workflow_run.head_branch }}
      commit_sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
