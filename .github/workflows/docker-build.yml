name: Docker Build

# Triggered by UnitTests completing — never on a raw push.
#   develop -> dev images (api, worker, web), tagged :develop
#   main    -> prod images (api, worker, web), tagged :latest, :production
#   tags    -> prod images (api, worker, web), tagged :latest, :<tag>, :production
#
# Because the trigger is workflow_run, images are only ever built from a commit
# whose UnitTests run succeeded (for branches). Tag pushes run directly.

on:
  workflow_run:
    workflows: ["UnitTests"]
    types: [completed]
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  determine-profile:
    name: Determine build profile
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      version: ${{ steps.profile.outputs.version }}
      tags: ${{ steps.profile.outputs.tags }}
      sha: ${{ steps.profile.outputs.sha }}
      ref_type: ${{ steps.profile.outputs.ref_type }}
      ref_name: ${{ steps.profile.outputs.ref_name }}
    steps:
      - name: Determine build profile
        id: profile
        run: |
          if [[ -n "${{ github.event.workflow_run.head_branch }}" ]]; then
            REF_TYPE="branch"
            REF_NAME="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            REF_TYPE="${{ github.ref_type }}"
            REF_NAME="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi

          if [[ "$REF_TYPE" == "tag" ]] || [[ "$REF_NAME" == "main" ]]; then
            echo "profile=prod" >> $GITHUB_OUTPUT
            echo "version=$REF_NAME" >> $GITHUB_OUTPUT
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "tags=latest,${{ github.ref_name }},production" >> $GITHUB_OUTPUT
            else
              echo "tags=latest,production" >> $GITHUB_OUTPUT
            fi
          else
            echo "profile=dev" >> $GITHUB_OUTPUT
            echo "version=${REF_NAME}-dev" >> $GITHUB_OUTPUT
            echo "tags=develop" >> $GITHUB_OUTPUT
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref_type=$REF_TYPE" >> $GITHUB_OUTPUT
          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT

  build-api:
    needs: [ determine-profile ]
    if: needs.determine-profile.outputs.profile == 'dev' || needs.determine-profile.outputs.profile == 'prod'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      name: API (${{ needs.determine-profile.outputs.profile }})
      dockerfile: ${{ needs.determine-profile.outputs.profile == 'dev' && 'docker/Dockerfile' || 'docker/Dockerfile.prod.dockerfile' }}
      image: ghcr.io/cgiar-agwise/kvuno-api
      profile: ${{ needs.determine-profile.outputs.profile }}
      ref_type: ${{ needs.determine-profile.outputs.ref_type }}
      ref_name: ${{ needs.determine-profile.outputs.ref_name }}
      sha: ${{ needs.determine-profile.outputs.sha }}
      version: ${{ needs.determine-profile.outputs.version }}
      tags: ghcr.io/cgiar-agwise/kvuno-api:${{ needs.determine-profile.outputs.tags }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-worker:
    needs: [ determine-profile ]
    if: needs.determine-profile.outputs.profile == 'dev' || needs.determine-profile.outputs.profile == 'prod'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      name: Worker (${{ needs.determine-profile.outputs.profile }})
      dockerfile: docker/Dockerfile.worker
      image: ghcr.io/cgiar-agwise/kvuno-worker
      profile: ${{ needs.determine-profile.outputs.profile }}
      ref_type: ${{ needs.determine-profile.outputs.ref_type }}
      ref_name: ${{ needs.determine-profile.outputs.ref_name }}
      sha: ${{ needs.determine-profile.outputs.sha }}
      version: ${{ needs.determine-profile.outputs.version }}
      tags: ghcr.io/cgiar-agwise/kvuno-worker:${{ needs.determine-profile.outputs.tags }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    needs: [ determine-profile ]
    if: needs.determine-profile.outputs.profile == 'dev' || needs.determine-profile.outputs.profile == 'prod'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      name: Web (${{ needs.determine-profile.outputs.profile }})
      dockerfile: frontend/Dockerfile
      image: ghcr.io/cgiar-agwise/kvuno-web
      profile: ${{ needs.determine-profile.outputs.profile }}
      ref_type: ${{ needs.determine-profile.outputs.ref_type }}
      ref_name: ${{ needs.determine-profile.outputs.ref_name }}
      sha: ${{ needs.determine-profile.outputs.sha }}
      version: ${{ needs.determine-profile.outputs.version }}
      tags: ghcr.io/cgiar-agwise/kvuno-web:${{ needs.determine-profile.outputs.tags }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}