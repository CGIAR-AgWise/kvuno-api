name: Docker Release

# Release builds, triggered by any tag push.
#
# Separate from docker-build.yml so neither needs compound branching: branch
# builds key off refs/heads, release builds off refs/tags.
#
# Produces a complete deployable pair:
#   kvuno-api    <- docker/Dockerfile.prod.dockerfile
#   kvuno-worker <- docker/Dockerfile.worker
#
# Tags: :latest, :<tag>, :production (see .github/actions/set-docker-tags).
#
# ⚠️ These builds FROM ghcr.io/masgeek/python-3.14-poetry:<version>, which no CI
# job builds or pushes. That package must be published and publicly readable, or
# every build here fails with a pull error.

on:
  push:
    tags:
      - '*'

permissions:
  # Declared once for the whole workflow. Every scope not listed here is set
  # to `none`, so the gate needs actions: read and the image jobs need
  # packages: write — they are in the same block because this repo is small
  # and all of the executing code is ours.
  contents: read
  actions: read
  packages: write

jobs:
  # A tag is usually cut from an already-tested commit, but UnitTests also runs
  # on the tag push itself. Gate on its conclusion so a release never
  # publishes from a commit whose checks failed.
  gate:
    name: Wait for UnitTests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      # No checkout: the gate only queries the GitHub API via `gh`, which is
      # preinstalled on the runner and authenticates from ${{ github.token }}.
      - id: gate
        uses: ./.github/actions/wait-for-checks
        with:
          workflow: UnitTests
          timeout: '1800'

      - name: Fail if checks did not pass
        if: steps.gate.outputs.passed != 'true'
        run: |
          echo "::error::UnitTests did not pass for ${{ github.sha }} — refusing to build images"
          echo "::error::conclusion: ${{ steps.gate.outputs.conclusion }}"
          echo "::error::run: ${{ steps.gate.outputs.url }}"
          exit 1

  build-api-release:
    needs: [ gate ]
    if: needs.gate.outputs.passed == 'true'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      dockerfile: docker/Dockerfile.prod.dockerfile
      app_version: ${{ github.ref_name }}
      image_name: ghcr.io/cgiar-agwise/kvuno-api
      branch_ref: refs/tags/${{ github.ref_name }}
      branch_name: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}

  build-worker-release:
    needs: [ gate ]
    if: needs.gate.outputs.passed == 'true'
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      dockerfile: docker/Dockerfile.worker
      app_version: ${{ github.ref_name }}
      image_name: ghcr.io/cgiar-agwise/kvuno-worker
      branch_ref: refs/tags/${{ github.ref_name }}
      branch_name: ${{ github.ref_name }}
      commit_sha: ${{ github.sha }}
