[project]
name = "kvuno-api"
version = "1.0.0"
description = """
Flask API for CGIAR AgWISE crop planting data. Ingests agricultural RDS and
Parquet files, deduplicates them by checksum, and serves optimised sowing
recommendations through a filterable, paginated API with PostGIS spatial
queries. Uploads are converted to Parquet on arrival; ingestion runs through
Celery with resumable, checkpointed batch processing.
"""
authors = [
    { name = "masgeek", email = "barsamms@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pyreadr (>=0.5.6,<0.6.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "waitress (>=3.0.2,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-limiter (>=4.1.1)",
    "flask-cors (>=6.0.5,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "flask-openapi3[swagger] (>=4.3.2,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "tqdm (>=4.67,<5.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "celery (>=5.4,<6.0)",
    "redis (>=6.0,<7.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pyarrow (>=20.0.0,<26.0.0)"
]

[project.scripts]
dev = "run:main"
dev-worker = "dev_worker:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.6,<5.0.0)",
    "sqlacodegen[geoalchemy2] (>=4.0.4,<5.0.0)",
    "pandas-stubs (>=3.0.3,<3.1.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9,<10)",
    "pytest-env (>=1,<2)",
    "pip-audit (>=2.10.1,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
sqlacodegen = { allow-prereleases = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "DB_URL=sqlite:///:memory:",
    "DB_DRIVER=sqlite",
    "DB_NAME=:memory:"
]

