# Security headers for the SPA's own responses (index.html and /assets/*).
#
# Included from each SPA `location` rather than set once at `server` level:
# nginx drops every inherited `add_header` in a location that declares its own
# (the Cache-Control ones below do), so a server-level header would silently
# vanish from exactly the responses it is meant for. Keeping them out of the
# server level also means the proxied API locations — notably /api-docs, whose
# Swagger UI needs inline script — keep the API's own headers instead of this
# stricter SPA policy.
#
# CSP notes:
# - script-src 'self': the Vite build emits only external module scripts (no
#   inline <script>), so no hash/nonce is needed.
# - style-src 'unsafe-inline': React `style={{…}}` props and Leaflet position
#   tiles/markers with inline style attributes.
# - img-src data: + OSM tiles: Bootstrap's CSS uses data: SVG icons (navbar
#   toggler, form controls); the map loads tiles from {a,b,c}.tile.openstreetmap.org.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
