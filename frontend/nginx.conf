# Serves the React SPA and reverse-proxies the API.
#
# This file is an nginx *template*: the image copies it to
# /etc/nginx/templates/, and the nginx entrypoint substitutes ${API_UPSTREAM}
# at container start (only API_* variables — NGINX_ENVSUBST_FILTER in the
# Dockerfile — so nginx's own $variables are left alone).
#
# The SPA and the API are same-origin from the browser's point of view, which
# means no CORS preflight, the bearer token never crosses origins, and the
# `token` cookie reaches /ui/* (the SSE job stream and download links rely on
# it). That only holds while this proxy reaches the right API — see
# API_UPSTREAM below.
#
# ── Why no `upstream` block ─────────────────────────────────────
# An `upstream { server api:80; }` is resolved ONCE, when nginx loads its
# config. If the api container restarts it gets a new IP, and nginx keeps
# dialling the old one — every request then fails with
# "connect() failed (111: Connection refused)" even though the API is fine.
# Putting the address in a variable and giving nginx a `resolver` forces
# re-resolution per request with a short TTL. 127.0.0.11 is Docker's embedded
# DNS (it also forwards public names); on a non-Docker host, point this at a
# real resolver (e.g. 8.8.8.8).

# Behind a TLS-terminating router, $scheme is http; keep the scheme the
# browser actually used when the router says so.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ── Which API to proxy to ────────────────────────────────────
    # API_UPSTREAM, default http://kvuno-api:80 (the compose container_name).
    # Never the bare service name `api`: on a Docker network shared with other
    # projects it resolved to SOMEONE ELSE's container — kvuno-ui answered
    # /health with another app's JSON and /api, /ui with 404 pages. If the UI
    # runs apart from the API's compose file, use the API's public URL
    # (e.g. https://kvuno.akilimo.org); see DEPLOYMENT.md for the rate-limit
    # trade-off that comes with it.
    set $api_upstream ${API_UPSTREAM};

    # ── Real client address ──────────────────────────────────────
    # Requests arrive through the platform router (Traefik, a load balancer),
    # so $remote_addr is the router. Trust X-Forwarded-For from private-network
    # peers only; a client connecting directly cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles can be cached forever; index.html must never be, or
    # clients keep loading a stale manifest of asset names after a deploy.
    #
    # Every SPA location includes security-headers.conf: a location with its
    # own add_header inherits none from the server level (see that file).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Source maps are built (vite `sourcemap: 'hidden'`) but never served: they
    # would publish the original source. A regex location wins over the
    # /assets/ prefix above.
    location ~* \.map$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── API ──────────────────────────────────────────────────────
    # Each location includes api-proxy.conf (pass + headers) and adds only
    # what differs: timeouts, body size, buffering.
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_read_timeout 60s;
        # nginx's default is 1 MB, which 413s POST /api/v1/data/upload long
        # before the API's own MAX_FILE_SIZE_MB cap (default 20 MB) applies.
        # The API enforces the limit; nginx does not second-guess it.
        client_max_body_size 0;
    }

    # The multipart upload converts RDS -> Parquet and reads its columns inside
    # the request, so it can run well past the 60s above on a large file.
    location = /api/v1/data/upload {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }

    # Swagger UI and the spec. flask-openapi3 mounts both under doc_prefix
    # ("/api-docs", app/__init__.py): the spec is /api-docs/openapi.json and
    # each UI plugin serves its page and assets below /api-docs/. No SPA
    # security headers here on purpose: the docs UI needs inline script, and
    # the API sets its own.
    location /api-docs {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_read_timeout 60s;
    }

    # ── Endpoints that still live on the API container ───────────
    # The tus upload endpoints (/ui/uploads/*), /ui/process, /ui/columns and
    # the jobs SSE stream are served by Flask and authenticated with the same
    # bearer token.
    #
    # SSE needs buffering off and a read timeout far above the default 60s:
    # the stream is long-lived and sends a keepalive comment every 15s.
    location /ui/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # tus PATCH bodies are 5 MB pieces; the API enforces MAX_FILE_SIZE
        # itself, at upload creation, before any bytes are accepted.
        client_max_body_size 0;
    }

    location = /health {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_read_timeout 15s;
    }

    # (There is no root /openapi.json: with doc_prefix="/api-docs" the spec is
    # served at /api-docs/openapi.json, proxied by the block above.)

    # ── SPA fallback ─────────────────────────────────────────────
    # Every unmatched path returns index.html so client-side routes
    # (/jobs, /explore, …) survive a hard refresh or a shared link. The
    # fallback is an internal redirect to /index.html, which picks up the
    # headers from `location = /index.html`; this include covers files served
    # directly from here (favicon.ico, etc.).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
