# Serves the React SPA and reverse-proxies the API.
#
# The SPA and the API are same-origin in production, which means no CORS
# preflight on every request and the bearer token never crosses origins.
#
# ── Why no `upstream` block ─────────────────────────────────────
# An `upstream { server api:80; }` is resolved ONCE, when nginx loads its
# config. If the api container restarts it gets a new IP, and nginx keeps
# dialling the old one — every request then fails with
# "connect() failed (111: Connection refused)" even though the API is fine.
# Docker also assigns the API's IP at start, so nginx starting first (or
# before the API is ready) locks in an address that never works.
#
# The fix is to put the hostname in a variable and give nginx a `resolver`,
# which forces re-resolution per request with a short TTL. 127.0.0.11 is
# Docker's embedded DNS; on a non-Docker host, point this at the real
# resolver (e.g. 8.8.8.8) or use a literal IP.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. `valid=10s` bounds how long a resolved address is
    # reused, so a restarted api container is picked up within 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles can be cached forever; index.html must never be, or
    # clients keep loading a stale manifest of asset names after a deploy.
    #
    # Every SPA location includes security-headers.conf: a location with its
    # own add_header inherits none from the server level (see that file).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Source maps are built (vite `sourcemap: 'hidden'`) but never served: they
    # would publish the original source. A regex location wins over the
    # /assets/ prefix above.
    location ~* \.map$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── API ──────────────────────────────────────────────────────
    # With a variable in proxy_pass the request URI is NOT appended
    # automatically, so $request_uri is passed explicitly. It includes the
    # query string, which the paginated endpoints rely on.
    location /api/ {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # nginx's default is 1 MB, which 413s POST /api/v1/data/upload long
        # before the API's own MAX_FILE_SIZE_MB cap (default 20 MB) applies.
        # The API enforces the limit; nginx does not second-guess it.
        client_max_body_size 0;
    }

    # The multipart upload converts RDS -> Parquet and reads its columns inside
    # the request, so it can run well past the 60s above on a large file.
    location = /api/v1/data/upload {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }

    # Swagger UI and the spec. flask-openapi3 mounts both under doc_prefix
    # ("/api-docs", app/__init__.py): the spec is /api-docs/openapi.json and
    # each UI plugin serves its page and assets below /api-docs/. Without this
    # block the SPA fallback answered with index.html. No SPA security headers
    # here on purpose: the docs UI needs inline script, and the API sets its own.
    location /api-docs {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ── Endpoints that still live on the API container ───────────
    # The HTML pages moved to this SPA, but the tus upload endpoints
    # (/ui/uploads/*), /ui/process, /ui/columns and the jobs SSE stream are
    # still served by Flask and are authenticated with the same bearer token.
    #
    # SSE needs buffering off and a read timeout far above the default 60s:
    # the stream is long-lived and sends a keepalive comment every 15s.
    location /ui/ {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # tus PATCH bodies are 5 MB pieces; the API enforces MAX_FILE_SIZE
        # itself, at upload creation, before any bytes are accepted.
        client_max_body_size 0;
    }

    location = /health {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # (There is no root /openapi.json: with doc_prefix="/api-docs" the spec is
    # served at /api-docs/openapi.json, proxied by the block above.)

    # ── SPA fallback ─────────────────────────────────────────────
    # Every unmatched path returns index.html so client-side routes
    # (/jobs, /explore, …) survive a hard refresh or a shared link. The
    # fallback is an internal redirect to /index.html, which picks up the
    # headers from `location = /index.html`; this include covers files served
    # directly from here (favicon.ico, etc.).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
