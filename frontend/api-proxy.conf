# How every API location forwards to the API. Included from each API location
# in nginx.conf; $api_upstream is set once at server level from API_UPSTREAM.
#
# With a variable in proxy_pass the request URI is NOT appended automatically,
# so $request_uri is passed explicitly. It includes the query string, which the
# paginated endpoints rely on.
proxy_pass $api_upstream$request_uri;

# Host is left at nginx's default, the UPSTREAM's own name ($proxy_host).
# Sending this site's host ($host) breaks an https upstream behind a router
# such as Traefik: it routes on Host, so the request came straight back here.
# The browser-facing host travels in X-Forwarded-Host instead, which the API's
# ProxyFix (x_host) reads.
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# $remote_addr is the real client here (see set_real_ip_from in nginx.conf), so
# the API's rate limiter, trusting one hop, sees each user rather than this
# container's address shared by everyone.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

# For an https upstream: send SNI, so a shared ingress serves the right
# certificate and routes to the right service.
proxy_ssl_server_name on;

proxy_connect_timeout 5s;
